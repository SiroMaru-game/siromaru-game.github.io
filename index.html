<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>しろまるの制作ノート</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      color: #37363d;
      background: #d9d3c8;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    .notebook {
      position: relative;
      width: min(900px, 100%);
      min-height: 680px;
      margin: auto;
      padding: 58px 7% 70px 12%;
      background:
        linear-gradient(90deg, transparent 0 68px, #e99a9a 69px 71px, transparent 72px),
        repeating-linear-gradient(#fffdf5 0 39px, #c9d9e5 40px 41px);
      border-radius: 8px 18px 18px 8px;
      box-shadow: 10px 12px 0 #b7afa2, 0 25px 55px #514b4033;
    }

    .notebook::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 24px;
      width: 16px;
      background: radial-gradient(circle, #d9d3c8 0 5px, transparent 6px) 0 12px / 16px 40px repeat-y;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 2px solid #45434a;
      padding-bottom: 12px;
    }

    .topline span {
      font-size: .85rem;
      letter-spacing: .18em;
    }

    h1 {
      margin: 28px 0 26px;
      font-size: clamp(2.5rem, 7vw, 5rem);
      letter-spacing: .08em;
      line-height: 1;
    }

    .portrait {
      float: right;
      width: clamp(130px, 25vw, 220px);
      margin: 4px 0 20px 24px;
      transform: rotate(4deg);
      filter: drop-shadow(5px 7px 0 #d8c795);
    }

    .pencil {
      position: absolute;
      top: 110px;
      right: -30px;
      width: 18px;
      height: 190px;
      border-radius: 9px 9px 3px 3px;
      background: linear-gradient(90deg, #e1a72f 0 22%, #ffd45d 23% 78%, #d69422 79%);
      transform: rotate(17deg);
      box-shadow: 3px 5px 0 #0002;
    }

    .pencil::before {
      content: "";
      position: absolute;
      top: -17px;
      left: 2px;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 18px solid #d8bd91;
    }

    .pencil::after {
      content: "";
      position: absolute;
      top: -19px;
      left: 6px;
      border-left: 3px solid transparent;
      border-right: 3px solid transparent;
      border-bottom: 7px solid #45434a;
    }

    .work {
      clear: both;
      margin-top: 34px;
      padding-top: 16px;
      border-top: 2px solid #45434a;
    }

    .work h2 {
      display: inline-block;
      margin: 0 0 18px;
      padding: 2px 10px;
      background: #f4d66d;
      font-size: 1.15rem;
      transform: rotate(-1deg);
    }

    .empty-space {
      min-height: 150px;
      border-bottom: 1px dashed #a8b8c2;
    }

    footer {
      margin-top: 20px;
      text-align: right;
      font-size: .8rem;
      letter-spacing: .12em;
    }

    @media (max-width: 600px) {
      body { padding: 20px 12px; }
      .notebook { padding: 38px 7% 48px 14%; }
      .pencil { right: -8px; transform: scale(.75) rotate(17deg); }
    }
  </style>
</head>
<body>
  <main class="notebook">
    <div class="topline">
      <span>SHIROMARU</span>
      <span>制作ノート　01</span>
    </div>

    <h1>しろまる</h1>

    <img class="portrait" src="./しろまる.png" alt="しろまる">
    <div class="pencil" aria-hidden="true"></div>

    <section class="work">
      <h2>つくったもの</h2>
      <div class="empty-space"></div>
    </section>

    <footer>GAME / EXPERIMENT / ARCHIVE</footer>
  </main>
</body>
</html>
