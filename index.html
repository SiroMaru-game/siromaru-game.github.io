<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>しろまるゲーム置き場</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      color: #37304d;
      font-family: sans-serif;
      background: linear-gradient(135deg, #fff4c7, #ffdce5, #d8f4ff);
    }
    main {
      max-width: 760px;
      margin: auto;
      padding: 32px;
      border: 4px solid white;
      border-radius: 28px;
      background: #ffffffdd;
      box-shadow: 0 12px 32px #66557722;
    }
    h1 { color: #ed6b8c; }
    .game {
      margin-top: 24px;
      padding: 20px;
      border-radius: 18px;
      background: #f2edff;
    }
    a { color: #6551bd; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 しろまるゲーム置き場</h1>
    <p>遊びに来てくれてありがとう！<br>ここに作ったゲームを並べていきます。</p>

    <section class="game">
      <h2>🌟 ゲーム一覧</h2>
      <p>ゲームは準備中です。お楽しみに！</p>
    </section>
  </main>
</body>
</html>
